name: Publish daily three

on:
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:
    inputs:
      verify_generation:
        description: "Test a new lesson without publishing the test lesson"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-content
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.DAILY_UPDATES_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment: content-publishing
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.save.outputs.revision }}
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test
      - name: Verify real generation without publishing the test lesson
        if: inputs.verify_generation == true
        run: npm run eval:daily
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TEXT_MODEL: ${{ vars.OPENAI_TEXT_MODEL }}
      - name: Prepare missing Brisbane daily pages
        run: npm run content:daily
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TEXT_MODEL: ${{ vars.OPENAI_TEXT_MODEL }}
      - run: npm run typecheck
      - run: npm run build
      - name: Save the daily content file
        id: save
        run: node scripts/publish-content.mjs
        env:
          GH_CONTENT_TOKEN: ${{ github.token }}

  publish:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      revision: ${{ needs.prepare.outputs.revision }}
